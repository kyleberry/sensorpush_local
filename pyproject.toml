[project]
name = "sensorpush_local"
version = "1.0.9"
description = "Local Bluetooth monitoring for SensorPush devices"
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "homeassistant==2026.11.2",
    # Unpinned on purpose (SENS-19): homeassistant and pytest-homeassistant pin
    # most of these exactly, so those two releases decide the versions and
    # uv.lock records them. An exact pin here conflicts whenever a package
    # releases ahead of Home Assistant.
    "bleak-retry-connector",
    "habluetooth",
    # aiousbwatcher, pyserial, serialx and aioesphomeapi are not used directly
    # by this integration but are hard-imported by homeassistant.components.usb
    # (pulled in via the bluetooth stack; serialx imports aioesphomeapi). HA's
    # wheel does not declare them in install_requires. Do not remove these.
    "aiousbwatcher",
    "pyserial",
    "serialx",
    "aioesphomeapi",
]

[project.optional-dependencies]
test = [
    # Home Assistant's own test harness. Its version always equals the
    # homeassistant release it was built from, so bump them together. The
    # bluetooth extra brings in what the enable_bluetooth fixture needs.
    "pytest-homeassistant[bluetooth]==2026.11.2",
    # Unpinned on purpose: pytest-homeassistant pins pytest-asyncio exactly,
    # so its release decides the version (uv.lock records it). An exact pin
    # here breaks `uv lock` whenever one releases ahead of the other.
    "pytest-asyncio",
    "pytest-cov",
    "argcomplete==3.7.2",
    "black==26.10.1",
    "flake8==7.5.0",
    "flake8-pyproject==1.2.4",
    "isort==9.0.2",
    "pylint==4.1.4",
]

[tool.uv]
# Only lock for the platforms this project is developed and tested on. On Intel
# macOS, aioesphomeapi caps cryptography below what homeassistant pins, so the
# lock can't resolve there (HA doesn't target that platform anyway).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pytest-homeassistant: let Home Assistant install its httpx alias before
# respx is imported. The harness still uses respx directly.
addopts = "-p no:respx"
log_cli = "true"
log_cli_level = "DEBUG"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:inotify is a Linux and FreeBSD API:UserWarning",
]

[tool.black]
line-length = 88
# Same as CI's --target-version, so a plain local `black` run formats the way
# CI checks. Without it black infers 3.14 from requires-python.
target-version = ["py313"]

[tool.isort]
profile = "black"
