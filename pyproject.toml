[project]
name = "sensorpush_local"
version = "1.0.6"
description = "Local Bluetooth monitoring for SensorPush devices"
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "homeassistant==2026.10.4",
    "bleak-retry-connector==4.7.1",
    # habluetooth is transitive (pulled in by bleak-retry-connector and
    # homeassistant) but pinned explicitly so it's a named package Renovate's
    # "home assistant ecosystem" group can --upgrade-package too. Without
    # this, `uv lock --upgrade-package homeassistant ...` leaves habluetooth
    # frozen at whatever's already locked, since neither declared dependency
    # forces a version new enough — it just satisfies their loose metadata
    # constraint without being runtime-compatible.
    "habluetooth==7.1.2",
    # aiousbwatcher and pyserial are not used directly by this integration
    # but are hard-imported by homeassistant.components.usb (pulled in via
    # the bluetooth stack). HA's wheel does not declare them in install_requires
    # so pip will not install them transitively. Do not remove these.
    "aiousbwatcher==1.1.2",
    "pyserial==3.5",
    # serialx and aioesphomeapi: hard-imported by homeassistant.components.usb
    # (serialx imports aioesphomeapi) — same undeclared-transitive-dependency
    # pattern as aiousbwatcher/pyserial above. Keep these at the versions in
    # HA's usb and esphome manifests for the pinned homeassistant release.
    "serialx==1.15.0",
    "aioesphomeapi==46.22.0",
]

[project.optional-dependencies]
test = [
    "pytest-homeassistant-custom-component==0.13.375",
    # Unpinned on purpose: pytest-homeassistant-custom-component pins both
    # exactly, so its release decides the version (uv.lock records it). An
    # exact pin here breaks `uv lock` whenever either releases ahead of it.
    "pytest-asyncio",
    "pytest-cov",
    "argcomplete==3.7.2",
    "black==26.10.1",
    "flake8==7.4.1",
    "flake8-pyproject==1.2.4",
    "isort==9.0.2",
    "pylint==4.1.3",
]

[tool.uv]
# Only lock for the platforms this project is developed and tested on. On Intel
# macOS, aioesphomeapi caps cryptography below what homeassistant pins, so the
# lock can't resolve there (HA doesn't target that platform anyway).
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
asyncio_mode = "auto"
log_cli = "true"
log_cli_level = "DEBUG"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:inotify is a Linux and FreeBSD API:UserWarning",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
