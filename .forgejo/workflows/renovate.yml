name: Renovate

# Let the active run finish before processing another trigger.
concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

on:
  schedule:
    # Daily at 12:00 UTC (06:00 CST / 07:00 CDT in America/Chicago).
    # The shared preset schedules majors on Sunday; minor/patch updates
    # can open on any run after three days. Lock file maintenance remains
    # Monday-only, and Home Assistant ecosystem updates stay manual.
    - cron: '0 12 * * *'
  workflow_dispatch:
  # Dependency dashboard checkbox interactions and PR comment commands.
  issues:
    types: [edited]
  issue_comment:
    types: [created]
  # Update dashboard and process follow-on work when a PR is merged or closed.
  pull_request:
    types: [closed]

jobs:
  renovate:
    name: Renovate
    runs-on: debian-trixie
    steps:
      - name: Run Renovate
        uses: https://gitea.berry.house/kyleberry/ci-tools/renovate-runner@d5fc996063208c5f328c8910e4316458455b82bd # v1.4.0
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # Signs Renovate's commits with the renovate-bot account's GPG key.
          RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.RENOVATE_GIT_PRIVATE_KEY }}
          # Needed to look up GitHub Actions releases without hitting API rate limits.
          GITHUB_COM_TOKEN: ${{ secrets.GITHUBCOM_TOKEN }}
