name: Renovate

on:
  schedule:
    # Forgejo evaluates cron in UTC. 12:00 UTC Monday is Monday morning in
    # America/Chicago year-round (07:00 CDT / 06:00 CST), so it falls inside
    # renovate.json's "on monday" schedule. The old 03:00 UTC was Sunday night
    # in Chicago, so every scheduled run was outside the schedule and created
    # no PRs.
    - cron: '0 12 * * 1'
  workflow_dispatch:
  # Dependency dashboard checkbox interactions and PR comment commands.
  issues:
    types: [edited]
  issue_comment:
    types: [created]
  # Update dashboard and process follow-on work when a PR is merged or closed.
  pull_request:
    types: [closed]

jobs:
  renovate:
    name: Renovate
    runs-on: debian-trixie
    steps:
      - name: Run Renovate
        run: renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Needed to look up GitHub Actions releases without hitting API rate limits.
          GITHUB_COM_TOKEN: ${{ secrets.GITHUBCOM_TOKEN }}
          LOG_LEVEL: info
