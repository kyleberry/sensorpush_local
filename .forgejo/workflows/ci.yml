name: CI

# No `permissions:` block — Forgejo doesn't scope FORGEJO_TOKEN/GITHUB_TOKEN
# via this field (GitHub-compat syntax only, a no-op here).

# PRs only. Branches get a PR right away, so branch-push runs were
# duplicates. This job is main's required check (`CI / test (pull_request)`):
# it used to be skipped for same-repo PRs, and Forgejo counts a skipped check
# as passed, so it never gated anything. Release PRs still trigger it because
# release.yml opens them with RELEASE_BOT_FORGEJO_TOKEN, not the Actions token.
on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: debian-trixie
    container:
      # .devcontainer/Dockerfile, published by ci-image.yml (SENS-10). The
      # runner force-pulls :latest before every job.
      image: registry.berry.house/sensorpush-local/ci:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache uv downloads
        id: uv_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-

      # --locked fails the build if uv.lock is out of sync with pyproject.toml
      # instead of silently regenerating it.
      - name: Sync dependencies
        run: uv sync --extra test --locked

      - name: Add venv to PATH
        run: echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Tests
        run: |
          pytest tests/

      - name: Check formatting (black)
        run: |
          black --check --target-version py313 custom_components/ tests/ scripts/

      - name: Check import order (isort)
        run: |
          isort --check-only custom_components/ tests/ scripts/

      - name: Lint (flake8)
        run: |
          flake8 custom_components/ tests/ scripts/

      - name: Lint (pylint)
        run: |
          pylint custom_components/ tests/ scripts/ --fail-under=9.5

  secret-scan:
    name: Secret scan
    runs-on: debian-trixie
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan full history
        uses: https://gitea.berry.house/kyleberry/ci-tools/gitleaks@d5fc996063208c5f328c8910e4316458455b82bd # v1.4.0
