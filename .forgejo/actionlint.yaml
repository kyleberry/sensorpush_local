# Passed explicitly because actionlint only discovers .github/ by default.
self-hosted-runner:
  labels:
    - debian-trixie

paths:
  .forgejo/workflows/**/*.{yml,yaml}:
    ignore:
      # Forgejo supports full action URLs; GitHub's action syntax does not.
      - 'specifying action "https://gitea\.berry\.house/kyleberry/ci-tools/.*" in invalid format'
