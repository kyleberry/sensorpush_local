repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^\.forgejo/workflows/.*\.ya?ml$
        args: [-config-file, .forgejo/actionlint.yaml, -shellcheck, shellcheck]
